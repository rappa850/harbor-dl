name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the Docker-mode browser tests expect the virtual display the container provides
      - name: Virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x1024x24 -ac -noreset >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          ls -l /tmp/.X11-unix/
      # The runner's system ffmpeg crashes (SIGSEGV) on the recording command; use the build that ships with imageio-ffmpeg.
      - name: Use the bundled ffmpeg
        run: |
          echo "HARBOR_FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          ffmpeg -version | head -1
      - run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
