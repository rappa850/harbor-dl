name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the Docker-mode browser tests expect the virtual display the container provides
      - name: Virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x1024x24 -ac -noreset >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.5; done
          ls -l /tmp/.X11-unix/
      # The runner's system ffmpeg crashes (SIGSEGV) on the recording command; use the build that ships with imageio-ffmpeg.
      - name: Use the bundled ffmpeg
        run: |
          echo "HARBOR_FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          ffmpeg -version | head -1
      - name: ffmpeg diagnostics (temporary)
        continue-on-error: true
        run: |
          set +e
          F="$HARBOR_FFMPEG"; cd "$RUNNER_TEMP"
          $F -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:sample_rate=44100 -t 1 -c:a mp2 -f mpegts audio.ts; echo "make audio-only sample: $?"
          $F -hide_banner -loglevel error -y -f lavfi -i testsrc=size=64x48:rate=5 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 1 -c:v mpeg2video -c:a mp2 -f mpegts av.ts; echo "make audio+video sample: $?"
          run() { name="$1"; shift; rm -f out.ts; "$@" 2>err.txt; echo "$name => exit $?"; head -c 300 err.txt; }
          run "A  -n  copy->mpegts      " $F -hide_banner -loglevel error -n -i audio.ts -c copy -f mpegts out.ts
          run "B  -y  copy->mpegts      " $F -hide_banner -loglevel error -y -i audio.ts -c copy -f mpegts out.ts
          run "C  -y -nostdin           " $F -hide_banner -loglevel error -y -nostdin -i audio.ts -c copy -f mpegts out.ts
          run "D  -y -> null muxer      " $F -hide_banner -loglevel error -y -i audio.ts -f null -
          run "E  -y copy->matroska     " $F -hide_banner -loglevel error -y -i audio.ts -c copy -f matroska out.mkv
          run "F  -y decode->wav        " $F -hide_banner -loglevel error -y -i audio.ts out.wav
          run "G  -y lavfi->copy mpegts " $F -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440 -t 1 -c:a mp2 -f mpegts out2.ts
          run "H  -y input is a pipe    " bash -c "cat audio.ts | $F -hide_banner -loglevel error -y -i - -c copy -f mpegts out3.ts"
          run "I  -y bare (no -hide...) " $F -y -i audio.ts -c copy -f mpegts out4.ts
          echo "--- file info"; ls -l audio.ts av.ts; file audio.ts 2>/dev/null | head -1; echo "ffmpeg binary:"; file "$F" | cut -c1-160; echo "--- ldd"; ldd "$F" 2>&1 | head -3
          echo "system ffmpeg:"; ffmpeg -version | head -1
          rm -f out.ts; ffmpeg -hide_banner -loglevel error -n -i audio.ts -map '0:v?' -map '0:a?' -c copy -f mpegts out.ts; echo "system ffmpeg, current args, audio-only => exit $?"
      - run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: npm run build
