; Everything except Harbor-DL itself listens on 127.0.0.1 only. noVNC / the VNC socket are reachable
; solely through Harbor-DL's authenticated /novnc and /websockify routes.
[program:xvfb]
command=bash -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 && exec Xvfb :99 -screen 0 1280x1024x24 -ac -noreset"
priority=1
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
; wait for the X socket first (supervisor's start order does not guarantee it is ready)
command=bash -c "for i in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && exec fluxbox; sleep 1; done; exit 1"
environment=DISPLAY=":99"
priority=2
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=bash -c "for i in $(seq 1 20); do [ -S /tmp/.X11-unix/X99 ] && exec x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -noxdamage; sleep 1; done; exit 1"
priority=3
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
command=websockify 127.0.0.1:6080 127.0.0.1:5900
priority=4
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:harbor-dl]
command=python -m uvicorn backend.app:app --host 0.0.0.0 --port 8765
directory=/app
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
